syntax = "proto3";

package api.v2;

import "api/v2/mii.proto";
import "api/v2/user_connections.proto";

message UpdateUserDataRequest {
  optional string server_access_level = 1;
  reserved 2;
  optional string birthday = 3;
  optional string gender = 4;
  optional string country = 5;
  optional string timezone = 6;
  optional string language = 7;
  optional bool marketing_flag = 8;
  optional string mii = 9;
  optional int32 region = 10;
}

message UpdateUserDataResponse {
  bool deleted = 1;
  string creation_date = 2;
  string updated_date = 3;
  uint32 pid = 4;
  string username = 5;
  int32 access_level = 6;
  string server_access_level = 7;
  Mii mii = 8;
  string birthday = 9;
  string gender = 10;
  string country = 11;
  string timezone = 12;
  string language = 13;
  string email_address = 14;
  UserConnections connections = 15;
  bool marketing_flag = 16;
  int32 region = 17;
}
